[workspace]
members = ["crates/runbook-core", "crates/runbook-cli", "crates/runbook-update", "src-tauri"]
default-members = ["crates/runbook-core", "crates/runbook-cli"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
