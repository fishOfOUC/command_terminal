[package]
name = "runbook-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "runbook"
path = "src/main.rs"

[dependencies]
runbook-core = { path = "../runbook-core" }
runbook-update = { path = "../runbook-update" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.28"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
portable-pty = "0.9"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
