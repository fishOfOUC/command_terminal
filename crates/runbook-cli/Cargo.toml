[package]
name = "runbook-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "runbook"
path = "src/main.rs"

[dependencies]
runbook-core = { path = "../runbook-core" }
runbook-update = { path = "../runbook-update" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
